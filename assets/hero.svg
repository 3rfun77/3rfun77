    <radialGradient id="glow"><stop stop-color="#55D9FF" stop-opacity="0.17"/><stop offset="1" stop-color="#55D9FF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#7F9FD0" stroke-opacity=".065" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
    <clipPath id="round"><rect width="1098" height="352" x="1" y="1" rx="21"/></clipPath>
  </defs>
