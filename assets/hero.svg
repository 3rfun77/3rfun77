<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="354" viewBox="0 0 1100 354" role="img" aria-label="Erfan Kamali — Senior Software Engineer focused on backend engineering, APIs and thoughtful software">
  <defs>
