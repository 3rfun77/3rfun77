 <circle cx="769" cy="81" r="6" fill="#6B58C4" opacity=".6"><animate attributeName="cx" values="766;779;766" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="790" cy="52" r="4" fill="#0969DA" opacity=".5"><animate attributeName="cy" values="52;59;52" dur="3.8s" repeatCount="indefinite"/></circle>
