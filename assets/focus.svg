  <radialGradient id="spot"><stop stop-color="#4BE4CE" stop-opacity=".10"/><stop offset="1" stop-color="#4BE4CE" stop-opacity="0"/></radialGradient>
  <clipPath id="round"><rect x="1" y="1" width="1098" height="290" rx="20"/></clipPath>
</defs>
