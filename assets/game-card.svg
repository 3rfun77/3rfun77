<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-label="Play Packet Runner: a tiny interactive networking arcade game">
 <defs>
   <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1D2D"/><stop offset="1" stop-color="#15203A"/></linearGradient>
   <linearGradient id="button" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54E3D0"/><stop offset="1" stop-color="#8CD8E6"/></linearGradient>
   <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#456981" opacity=".45"/></pattern>
 </defs>
 <rect x="1" y="1" width="1098" height="218" rx="19" fill="url(#bg)" stroke="#42677B"/>
 <rect x="2" y="2" width="1096" height="216" rx="19" fill="url(#dots)" opacity=".5"/>
 <text x="39" y="48" fill="#5DE6D1" font-family="Consolas,Monaco,monospace" font-size="13" font-weight="700" letter-spacing="2">A LITTLE BREAK BETWEEN DEPLOYS</text>
 <text x="39" y="103" fill="#F3F8FF" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">Packet Runner <tspan fill="#5DE6D1">/ arcade</tspan></text>
 <text x="41" y="134" fill="#9FB7C9" font-family="Arial,Helvetica,sans-serif" font-size="16">Route good packets. Dodge bugs. Beat the clock.</text>
 <rect x="40" y="154" width="221" height="44" rx="12" fill="url(#button)"/>
 <text x="72" y="183" fill="#071927" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">▶  PLAY THE GAME</text>
 <text x="282" y="181" fill="#7F9AAA" font-family="Consolas,monospace" font-size="12">30 seconds · keyboard / touch</text>
 <rect x="690" y="29" width="364" height="164" rx="15" fill="#0B1525" stroke="#345470"/>
 <text x="708" y="52" fill="#7E9EB7" font-family="Consolas,Monaco,monospace" font-size="11">packet_runner.exe</text>
 <circle cx="1020" cy="47" r="4" fill="#5CE5C5"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
 <path d="M707 61 H1036" stroke="#345470"/>
 <g fill="none" stroke="#243D57" opacity=".85"><path d="M710 91H1035 M710 126H1035 M710 161H1035"/><path d="M747 71V178 M795 71V178 M843 71V178 M891 71V178 M939 71V178 M987 71V178"/></g>
 <g fill="#5CE8D2">
  <circle cx="767" cy="85" r="7"><animate attributeName="cy" values="78;147;78" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="946" cy="123" r="6"><animate attributeName="cy" values="73;160;73" dur="3.8s" begin=".4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin=".4s" repeatCount="indefinite"/></circle>
 </g>
 <g fill="#F0859E"><circle cx="874" cy="95" r="7"><animate attributeName="cy" values="73;156;73" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle></g>
 <rect x="828" y="167" width="100" height="17" rx="7" fill="#51DFCD"/>
 <rect x="846" y="172" width="65" height="6" rx="3" fill="#1E5260"/>
</svg>
